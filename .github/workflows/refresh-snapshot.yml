name: Refresh snapshot

on:
  schedule:
    # 22:00 UTC = ~06:00 Beijing / ~18:00 EDT (next day)
    # 距 21:32 澳门 draw 约 30 分钟, 让本地 cron 先跑完
    - cron: '0 22 * * *'
  workflow_dispatch:    # 手动触发: Actions tab → Refresh snapshot → Run

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        working-directory: atlas
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --quiet scrapy requests pymysql

      - name: Fetch latest lottery data
        working-directory: atlas
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          # Best-effort: try to refresh. If upstream is down, we still commit
          # the existing snapshot.json (no-op) so Vercel rebuild has fresh code.
          source .venv/bin/activate
          python atlas/spiders/m2_5_daily_fetcher.py || echo "WARN: fetcher failed, keeping existing snapshot"

      - name: Re-export snapshot.json (best-effort on CI)
        working-directory: atlas
        continue-on-error: true
        # On Linux CI without DB, this writes an EMPTY fallback snapshot.
        # We don't want that to overwrite the real data the Mac already pushed.
        # The actual commit/push step below uses --allow-empty so it triggers
        # Vercel rebuild without touching snapshot.json when export fails.
        run: |
          source .venv/bin/activate
          python export_snapshot.py || echo "export failed (expected on CI)"
          # If CI wrote empty data, REVERT so we don't clobber real data
          if [ -f "$GITHUB_WORKSPACE/atlas-ui/public/data/snapshot.json" ]; then
            REAL_SIZE=$(stat -c%s "$GITHUB_WORKSPACE/atlas-ui/public/data/snapshot.json" 2>/dev/null || stat -f%z "$GITHUB_WORKSPACE/atlas-ui/public/data/snapshot.json")
            if [ "$REAL_SIZE" -lt "10000" ]; then
              echo "CI wrote tiny snapshot ($REAL_SIZE bytes) — restoring real data from git"
              git checkout HEAD -- atlas-ui/public/data/snapshot.json
            fi
          fi

      - name: Commit and push (trigger Vercel rebuild)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add atlas-ui/public/data/snapshot.json
          # --allow-empty ensures we still push a trigger commit even if
          # the snapshot didn't change (so Vercel rebuilds the frontend).
          git commit --allow-empty -m "chore: refresh snapshot.json $(date -u +'%Y-%m-%d %H:%M UTC')" || {
            echo "nothing to commit"
            exit 0
          }
          git push origin main
          echo "pushed → Vercel will rebuild"