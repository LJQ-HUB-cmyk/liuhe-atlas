name: Refresh snapshot

on:
  schedule:
    # 22:00 UTC = ~06:00 Beijing / ~18:00 EDT (next day)
    # 距 21:32 澳门 draw 约 30 分钟, 让本地 cron 先跑完
    - cron: '0 22 * * *'
  workflow_dispatch:    # 手动触发: Actions tab → Refresh snapshot → Run workflow

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        # Fetch the full history so we can compare snapshot.json against HEAD.
        with:
          fetch-depth: 0

      # IMPORTANT: We DO NOT touch atlas-ui/public/data/snapshot.json here.
      #
      # Why: Linux CI runner has no SQLite DB, so export_snapshot.py would
      # fall back to writing an empty snapshot (394 bytes), which clobbers
      # the real ~70K data the Mac cron already pushed.
      #
      # Instead, real data is owned by the Mac cron:
      #   ~/.hermes/scripts/liuhe-atlas-daily.sh  (runs 21:35 EDT daily)
      #   → cd atlas && ./.venv/bin/python export_snapshot.py
      #   → writes atlas-ui/public/data/snapshot.json (real DB data)
      #
      # This workflow's only job is to nudge Vercel to rebuild the frontend
      # once a day so the deployed site picks up the latest snapshot.
      # We do that with an empty commit.

      - name: Verify snapshot is real data (sanity check)
        run: |
          SIZE=$(stat -c%s atlas-ui/public/data/snapshot.json 2>/dev/null || stat -f%z atlas-ui/public/data/snapshot.json)
          PERIODS=$(python3 -c "import json; print(json.load(open('atlas-ui/public/data/snapshot.json'))['meta'].get('period_count', 0))")
          echo "snapshot.json size: ${SIZE} bytes"
          echo "snapshot.json periods: ${PERIODS}"
          if [ "$SIZE" -lt "10000" ] || [ "$PERIODS" -lt "5" ]; then
            echo "WARN: snapshot looks empty (size=${SIZE}, periods=${PERIODS})"
            echo "WARN: this may indicate the Mac cron hasn't run yet, or the"
            echo "WARN: empty-fallback from a previous bad export is still on HEAD."
            echo "WARN: skipping push — please investigate before re-enabling this workflow."
            exit 1
          fi
          echo "OK — snapshot has real data, safe to proceed."

      - name: Trigger Vercel rebuild (empty commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # --allow-empty: push a commit even if nothing changed, just to
          # trigger Vercel's deploy webhook.
          git commit --allow-empty -m "chore: trigger Vercel rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Pull first to defend against a concurrent push from the Mac
          # (e.g. if you ran `git push` while CI was running).
          git pull --rebase --autostash origin main || {
            echo "rebase conflict — Mac pushed while we were running."
            echo "Aborting to avoid clobbering the Mac's data."
            exit 1
          }
          git push origin main
          echo "pushed → Vercel will rebuild"